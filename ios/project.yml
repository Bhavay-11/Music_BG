# XcodeGen spec. On a Mac:  brew install xcodegen  →  cd ios && xcodegen generate  →  open MusicBG.xcodeproj
name: MusicBG
options:
  bundleIdPrefix: com.duetify
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MusicBG:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duetify.musicbg
        MARKETING_VERSION: "2.0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Music_BG
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
